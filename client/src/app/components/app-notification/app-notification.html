<div class="notif-backdrop" (click)="onBackdropClick()">
    <div class="notif-container" (click)="stopClick($event)">
        <div class="notif-header">
            <div class="notif-title">
                <div class="notif-bell">
                    <i class="fa-regular fa-bell"></i>
                </div>
                <h4>Notifications</h4>
            </div>
        </div>
        <hr class="divider" />
        <div class="notif-body" [class.has-list]="!loading && notifications.length > 0">
            @if (loading) {
            <p class="notif-empty">Loading...</p>
            } @else {
            <div class="notif-list">
                @for (n of notifications; track n.id) {
                <div class="notif-item" [class.unread]="n.is_read === false">
                    <div class="notif-item-content">
                        <div class="notif-item-msg">{{ n.message }}</div>
                        @if (n.created_at) {
                        <div class="notif-item-date">
                            Date: {{ n.created_at | date:'dd.MM.yyyy HH:mm' }}
                        </div>
                        }
                    </div>
                </div>
                }
            </div>
            }
        </div>
    </div>
</div>
