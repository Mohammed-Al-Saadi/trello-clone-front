<div class="notif-backdrop" (click)="onBackdropClick()">
    <div class="notif-container" (click)="stopClick($event)">
        <div class="notif-header">
            <h4>Notifications</h4>

            <button class="notif-clear-btn" *ngIf="messages.length > 0" (click)="clearAll($event)" type="button">
                Clear
            </button>
        </div>

        <hr class="divider" />

        <div class="notif-body" *ngIf="messages.length > 0; else emptyState">
            <div class="notif-item" *ngFor="let msg of messages">
                <div class="notif-message">{{ msg.text || msg.message || 'No content' }}</div>
                <div class="notif-time">
                    <i class="fa-regular fa-clock notif-time-icon"></i>
                    <span>{{ msg._ts | date:'short' }}</span>
                </div>
            </div>
        </div>

        <ng-template #emptyState>
            <div class="notif-body">
                <div class="notif-icon">
                    <i class="fa-regular fa-bell-slash"></i>
                </div>
                <p class="notif-empty">No notifications yet.</p>
            </div>
        </ng-template>
    </div>
</div>
