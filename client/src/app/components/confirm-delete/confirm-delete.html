<div class="modal-backdrop" *ngIf="show">
  <div class="modal">
    <h2>{{ title }}</h2>
    <p>{{ message }}</p>

    <div class="actions">
      <button class="btn cancel" (click)="cancel()">{{ cancelText }}</button>
      <button class="btn delete" (click)="confirm()">{{ confirmText }}</button>
    </div>
  </div>
</div>
