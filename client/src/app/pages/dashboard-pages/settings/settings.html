<app-dashboard-info-panel title="Settings"></app-dashboard-info-panel>

<div class="settings-container" *ngIf="user$ | async as user">
    <div class="card">
        <h3 class="card-title">
            <mat-icon class="icon">person</mat-icon>
            User Information
        </h3>

        <div class="user-info">
            <div class="info-row">
                <span class="info-label">Full Name</span>
                <span class="info-value">{{ user?.full_name || user?.fullName || '-' }}</span>
            </div>

            <div class="info-row">
                <span class="info-label">Email</span>
                <span class="info-value">{{ user?.email || '-' }}</span>
            </div>
        </div>
    </div>

    <div class="card">
        <h3 class="card-title">
            <mat-icon class="icon">lock</mat-icon>
            Update Password
        </h3>

        <div class="grid">
            <div class="field">
                <app-floating-field label="Current Password" placeholder="••••••••" inputType="password"
                    [model]="passwords.current" (modelChange)="passwords.current = $event"></app-floating-field>
            </div>

            <div class="field">
                <app-floating-field label="New Password" placeholder="At least 8 characters" inputType="password"
                    [model]="passwords.new" (modelChange)="passwords.new = $event"></app-floating-field>
            </div>

            <div class="field">
                <app-floating-field label="Confirm New Password" placeholder="Repeat new password" inputType="password"
                    [model]="passwords.confirm" (modelChange)="passwords.confirm = $event"></app-floating-field>
            </div>

            <div class="field align-end">
                <button (click)="updatePassword(user)" [disabled]="loading">
                    {{ loading ? 'Updating...' : 'Update Password' }}
                </button>
            </div>
        </div>
    </div>
</div>
